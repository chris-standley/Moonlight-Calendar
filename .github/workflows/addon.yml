# Builds the Home Assistant add-on image for amd64 and aarch64 from the repo root (addon/Dockerfile),
# checks that it starts, and on main pushes it to GHCR as <image>:<version> and <image>:latest
# (image and version from addon/config.yaml). A version that is already published is not pushed again on
# a plain push to main, so bump `version` in addon/config.yaml to release; workflow_dispatch always pushes.
name: Add-on image

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "addon/**"
      - "backend/moonlight/**"
      - "backend/requirements.txt"
      - "frontend/**"
      - "seed/**"
      - ".dockerignore"
      - ".github/workflows/addon.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: addon-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version, image and base image
        id: meta
        run: |
          version="$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' addon/config.yaml)"
          image="$(sed -n 's/^image:[[:space:]]*//p' addon/config.yaml | sed "s/{arch}/${ARCH}/")"
          base="$(sed -n "s/^[[:space:]]*${ARCH}:[[:space:]]*//p" addon/build.yaml)"
          backend="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/moonlight/__init__.py)"
          echo "version=${version} image=${image} base=${base} backend=${backend}"
          if [ -z "$version" ] || [ -z "$image" ] || [ -z "$base" ]; then
            echo "::error::Could not read version/image from addon/config.yaml or the ${ARCH} base from addon/build.yaml"
            exit 1
          fi
          if [ "$version" != "$backend" ]; then
            echo "::error::addon/config.yaml version ${version} != backend/moonlight/__init__.py __version__ ${backend}"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "image=${image}"
            echo "base=${base}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to publish
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          push=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            push=true
          elif [ "$EVENT" = "push" ]; then
            if docker manifest inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
              echo "${IMAGE}:${VERSION} is already published; bump version in addon/config.yaml to release."
            else
              push=true
            fi
          fi
          echo "push=${push}"
          echo "push=${push}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          load: true
          push: false
          provenance: false

      - name: Check the container starts
        env:
          IMG: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eux
          docker run --rm --platform "$PLATFORM" --entrypoint python3 "$IMG" \
            -c "import moonlight.main, caldav, lxml.etree, PIL.Image, pillow_heif; print('imports ok')"
          # TZ needs the zone files (tzdata) under musl.
          test "$(docker run --rm --platform "$PLATFORM" --entrypoint date -e TZ=America/Chicago "$IMG" +%Z)" != "UTC"
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name moonlight --platform "$PLATFORM" -p 8099:8099 -v "$RUNNER_TEMP/data:/data" \
            -e MOONLIGHT_DEMO=1 -e MOONLIGHT_AUTH=off \
            -e TZ=America/Chicago -e MOONLIGHT_TIMEZONE=America/Chicago \
            --entrypoint python3 "$IMG" -m moonlight
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8099/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8099/api/health | grep -F "\"version\":\"${VERSION}\""
          curl -fsS http://localhost:8099/display/kitchen | grep -F '<div id="root">'
          curl -fsS http://localhost:8099/api/settings | grep -F '"timezone":"America/Chicago"'
          curl -fsS http://localhost:8099/api/people | grep -F '"name"'

      - name: Container logs
        if: always()
        run: docker logs moonlight 2>&1 || true

      - name: Push to GHCR
        if: steps.publish.outputs.push == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
