# Publishes a GitHub release for the Home Assistant integration (custom_components/moonlight) whenever
# `version` in its manifest.json changes on main. HACS offers updates from these releases, tagged
# v<manifest version>, so bump the manifest version to ship an integration change; a version that already has
# a release is skipped. workflow_dispatch publishes the current version if it has no release yet.
name: Integration release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/moonlight/manifest.json"
      - "hacs.json"
      - ".github/workflows/integration-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integration-release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release if this version has none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version custom_components/moonlight/manifest.json)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::custom_components/moonlight/manifest.json version '${version}' is not x.y.z"
            exit 1
          fi
          tag="v${version}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release ${tag} already exists; bump version in custom_components/moonlight/manifest.json to release."
            exit 0
          fi
          addon="$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' addon/config.yaml)"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Integration ${version}" \
            --notes "Moonlight Home Assistant integration ${version} (released alongside add-on ${addon}). Install or update through HACS."
