name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx radicale
      - run: python -m pytest -q -p no:cacheprovider tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:demo

  apple:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apple
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Moonlight
            destination: generic/platform=iOS Simulator
          - scheme: Moonlight TV
            destination: generic/platform=tvOS Simulator
    name: apple (${{ matrix.scheme }})
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator (unsigned)
        run: |
          xcodebuild -version
          xcodebuild -project Moonlight.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Debug \
            -destination "${{ matrix.destination }}" CODE_SIGNING_ALLOWED=NO build \
            | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
