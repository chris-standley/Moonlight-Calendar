configuration:
  demo:
    name: Demo family
    description: Seed the demo family (people, events, chores, lists, meals) into an empty database on first start.
  weather_entity:
    name: Weather entity
    description: >-
      A Home Assistant weather entity to show on the displays, e.g. weather.home or weather.forecast_home.
      Leave empty to use the built-in demo forecast.
  require_pairing:
    name: Require pairing
    description: >-
      Wall screens on port 8099 must be paired in Moonlight (Settings > Screens) before they can use Moonlight.
      Moonlight in the Home Assistant sidebar is always signed in.
