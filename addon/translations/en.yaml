configuration:
  demo:
    name: Demo family
    description: Seed the demo family (people, events, chores, lists, meals) into an empty database on first start.
  require_pairing:
    name: Require pairing
    description: >-
      Wall screens on port 8091 must be paired in Moonlight (Settings > Screens) before they can use Moonlight.
      Moonlight in the Home Assistant sidebar is always signed in.
