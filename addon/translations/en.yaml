configuration:
  demo:
    name: Demo family
    description: Seed the demo family (people, events, chores, lists, meals) into an empty database on first start.
  weather_entity:
    name: Weather entity
    description: >-
      A Home Assistant weather entity to show on the displays, e.g. weather.home or weather.forecast_home.
      Leave empty to use the built-in demo forecast.
  media_player_entity:
    name: Kitchen speaker
    description: >-
      A media_player entity for the kitchen screen's Now playing card, e.g. media_player.kitchen from the Music
      Assistant integration. Other screens can be given a speaker in Moonlight (Settings > Music).
  require_pairing:
    name: Require pairing
    description: >-
      Wall screens on port 8091 must be paired in Moonlight (Settings > Screens) before they can use Moonlight.
      Moonlight in the Home Assistant sidebar is always signed in.
