name: Moonlight
version: "0.2.0"
slug: moonlight
description: Family wall calendar, chores, lists and meal planner for kiosk displays
url: https://github.com/chris-standley/Moonlight-Calendar
# Prebuilt by .github/workflows/addon.yml in chris-standley/Moonlight-Calendar; HA pulls <image>:<version>.
image: ghcr.io/chris-standley/{arch}-moonlight-addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-heart
panel_title: Moonlight
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Direct access for wall-mounted kiosk displays (e.g. http://homeassistant.local:8099/display/hallway)
map:
  - data:rw
homeassistant_api: true
options:
  demo: true
  require_pairing: true
schema:
  demo: bool
  weather_entity: str?
  require_pairing: bool
