add_chore:
  fields:
    person:
      required: true
      example: Chris
      selector:
        text:
          multiple: true
    title:
      required: true
      example: Put the bins out
      selector:
        text:
    emoji:
      required: false
      example: "🗑️"
      selector:
        text:
    points:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 100
          mode: box
    time_of_day:
      required: false
      default: anytime
      selector:
        select:
          options:
            - morning
            - afternoon
            - evening
            - anytime
    date:
      required: false
      selector:
        date:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: moonlight

complete_chore:
  fields:
    person:
      required: true
      example: Ada
      selector:
        text:
    chore:
      required: true
      example: Make bed
      selector:
        text:
    date:
      required: false
      selector:
        date:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: moonlight

award_stars:
  fields:
    person:
      required: true
      example: Ada
      selector:
        text:
    stars:
      required: true
      example: 5
      selector:
        number:
          min: -100
          max: 100
          mode: box
    reason:
      required: false
      example: Helped with the shopping
      selector:
        text:
    pin:
      required: false
      selector:
        text:
          type: password
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: moonlight

add_list_item:
  fields:
    list:
      required: true
      example: Groceries
      selector:
        text:
    item:
      required: true
      example: Milk
      selector:
        text:
    due:
      required: false
      selector:
        date:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: moonlight

show_notification:
  fields:
    title:
      required: false
      example: Dinner's ready
      selector:
        text:
    message:
      required: false
      example: Come to the table, everyone
      selector:
        text:
          multiline: true
    screens:
      required: false
      example: Kitchen
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - all
            - large
            - compact
            - phone
            - app
    style:
      required: false
      default: fullscreen
      selector:
        select:
          options:
            - fullscreen
            - toast
    duration:
      required: false
      example: "00:00:30"
      selector:
        duration:
    icon:
      required: false
      example: "🍝"
      selector:
        text:
    image:
      required: false
      example: https://example.com/picture.jpg
      selector:
        text:
          type: url
    dismissible:
      required: false
      default: true
      selector:
        boolean:
    chime:
      required: false
      default: false
      selector:
        boolean:
    id:
      required: false
      example: dinner
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: moonlight

start_timer:
  fields:
    label:
      required: true
      example: Pizza
      selector:
        text:
    description:
      required: false
      example: Take it out of the oven
      selector:
        text:
    duration:
      required: false
      example: "00:12:00"
      selector:
        duration:
    until:
      required: false
      selector:
        datetime:
    count_up:
      required: false
      default: false
      selector:
        boolean:
    since:
      required: false
      selector:
        datetime:
    screens:
      required: false
      example: Kitchen
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - all
            - large
            - compact
            - phone
            - app
    style:
      required: false
      default: toast
      selector:
        select:
          options:
            - fullscreen
            - toast
    finished_for:
      required: false
      selector:
        duration:
    icon:
      required: false
      example: "🍕"
      selector:
        text:
    dismissible:
      required: false
      default: true
      selector:
        boolean:
    chime:
      required: false
      selector:
        boolean:
    id:
      required: false
      example: pizza
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: moonlight

clear_notifications:
  fields:
    id:
      required: false
      example: pizza
      selector:
        text:
          multiple: true
    screens:
      required: false
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - large
            - compact
            - phone
            - app
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: moonlight
