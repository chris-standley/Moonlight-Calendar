add_chore:
  fields:
    person:
      required: true
      example: Chris
      selector:
        text:
          multiple: true
    title:
      required: true
      example: Put the bins out
      selector:
        text:
    emoji:
      required: false
      example: "🗑️"
      selector:
        text:
    points:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 100
          mode: box
    time_of_day:
      required: false
      default: anytime
      selector:
        select:
          options:
            - morning
            - afternoon
            - evening
            - anytime
    date:
      required: false
      selector:
        date:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: moonlight

complete_chore:
  fields:
    person:
      required: true
      example: Ada
      selector:
        text:
    chore:
      required: true
      example: Make bed
      selector:
        text:
    date:
      required: false
      selector:
        date:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: moonlight

award_stars:
  fields:
    person:
      required: true
      example: Ada
      selector:
        text:
    stars:
      required: true
      example: 5
      selector:
        number:
          min: -100
          max: 100
          mode: box
    reason:
      required: false
      example: Helped with the shopping
      selector:
        text:
    pin:
      required: false
      selector:
        text:
          type: password
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: moonlight

add_list_item:
  fields:
    list:
      required: true
      example: Groceries
      selector:
        text:
    item:
      required: true
      example: Milk
      selector:
        text:
    due:
      required: false
      selector:
        date:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: moonlight
